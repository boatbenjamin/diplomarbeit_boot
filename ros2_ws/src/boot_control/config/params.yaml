# =====================================================================
# config/params.yaml  -- Parameter fuer den GNC-Stack in VRX (WAM-V)
# =====================================================================
# Die Plattformwerte stammen aus dem VRX-Quellcode:
#   vrx_urdf/wamv_gazebo/urdf/thruster_layouts/wamv_aft_thrusters.xacro
#     -> Motorpositionen y = +-1.027135 m
#   vrx_urdf/wamv_gazebo/urdf/dynamics/wamv_gazebo_dynamics_plugin.xacro
#     -> xU=100, xUU=150, nR=800, nRR=800
#   vrx_urdf/wamv_description/urdf/wamv_base.urdf.xacro
#     -> Masse 180 kg, Izz 446 kg m^2 (+ Motoren/Anbauten -> ca. 700)
#
# FUER DAS REALE BOOT: nur diesen Block austauschen, kein Code-Eingriff.
#   d_y: 0.15 / f_max: 200.0 / izz, n_r, masse, x_u, x_uu ausmessen.
# =====================================================================

boat_control_node:
  ros__parameters:
    timer_hz: 50.0

    # --- Geometrie / Aktorik ---
    d_y: 1.027135          # m, halber Motorabstand (VRX WAM-V)
    f_max: 1500.0           # N je Motor (VRX laesst 2353 N zu)
    r_max_deg: 50.0        # maximale Soll-Gierrate
    u_max: 3.0            # m/s (Grenze aus 2*f_max = x_u*u + x_uu*u^2)

    # --- Gierdynamik: Izz*r_dot + n_r*r = N ---
    izz: 700.0
    n_r: 800.0

    # --- Laengsdynamik: m*u_dot + x_u*u + x_uu*|u|u = X ---
    masse: 250.0
    x_u: 100.0
    x_uu: 150.0

    # --- Reglerauslegung ---
    omega_i: 1.5           # rad/s Bandbreite innere Gierratenschleife
                           #   -> Kp_r = izz*omega_i = 1050 Nm/(rad/s)
                           #   -> Kff_r = n_r = 800
    omega_a_faktor: 5.0    # aeussere Schleife = omega_i/5 = 0.3 rad/s
    dpsi_max_deg: 30.0 # Rate des Kurs-Referenzmodells (< r_max!)

    stoppe_bei_mission_completed: true

wave_filter_node:
  ros__parameters:
    rate_hz: 50.0
    tau_psi: 0.30          # s, Komplementaerfilter IMU-Orientierung <-> Gyro
    tau_vel: 0.50          # s, Tiefpass auf die GPS-Geschwindigkeit
    tau_pos: 0.20          # s, Tiefpass auf die GPS-Position
    heading_offset_deg: 0.0
    gps_topic: '/wamv/sensors/gps/gps/fix'
    imu_topic: '/wamv/sensors/imu/imu/data'

thrust_to_vrx_node:
  ros__parameters:
    vrx_thrust_max: 1000.0 # N je Thruster (VRX-Limit: 2353 N)
    cmd_timeout: 0.5       # s ohne /cmd/thrust -> 0 N
    publish_hz: 50.0
    left_topic: '/wamv/thrusters/left/thrust'
    right_topic: '/wamv/thrusters/right/thrust'

guidance_ilos_node:
  ros__parameters:
    delta: 3.0             # m, Lookahead. 2.0 war fuer ein 5 m langes
                           # WAM-V zu kurz -> Zickzack auf der Geraden.
                           # Faustregel: 2-3 Schiffslaengen.
    sigma: 0.10
    i_max: 3.0
    u_max: 2.0
    u_min: 0.5             # m/s Mindestfahrt (Ruderwirkung erhalten)
    a_quer_max: 2.0
    k3: 1.0
    timer_hz: 10.0

course_manager_node:
  ros__parameters:
    num_path_points: 400
    backward_extension: 15.0
    loop_radius_factor: 0.5
    num_laps: 1
    expected_marks: 2
    mark_match_gate: 5.0
    mark_lock_after: 5

mission_manager_node:
  ros__parameters:
    acceptance_radius: 4.0
    min_progress_fraction: 0.95

collision_avoidance_node:
  ros__parameters:
    timer_hz: 10.0

object_tracker_node:
  ros__parameters:
    gate_threshold: 3.0
    max_age_seconds: 2.0
    m_confirm: 3
    n_window: 5
    dt: 0.1

detection_bridge_node:
  ros__parameters:
    boje_durchmesser: 0.35

pose_to_odom_node:
  ros__parameters:
    child_frame: 'wamv/base_link'
    odom_frame: 'odom'

course_test_node:
  ros__parameters:
    psi_c_deg: 90.0
    u_c: 1.5
    rate_hz: 10.0
    sequenz_dauer: 0.0
    log_periode: 2.0
